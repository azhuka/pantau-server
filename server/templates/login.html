<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Pantau Server</title>
<style>
:root{--bg:#0c0e14;--card:#181b27;--border:#23273a;--text:#e2e4ea;--dim:#6b7094;--blue:#3b82f6;--red:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;min-height:100vh}
.login-box{width:380px}
.login-header{text-align:center;margin-bottom:32px}
.login-header .logo{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:12px;background:rgba(59,130,246,0.12);color:var(--blue);margin-bottom:12px}
.login-header h1{font-size:20px;font-weight:600}
.login-header p{color:var(--dim);font-size:13px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:28px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-group input{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:14px;outline:none}
.form-group input:focus{border-color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.btn{width:100%;padding:10px;background:var(--blue);color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer;margin-top:8px}
.btn:hover{opacity:.85}
.error{background:rgba(239,68,68,.12);color:var(--red);padding:10px;border-radius:6px;font-size:13px;margin-bottom:16px}
</style>
</head>
<body>
<div class="login-box">
  <div class="login-header">
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
    </div>
    <h1>Pantau Server</h1>
    <p>Masuk ke panel monitoring</p>
  </div>
  <div class="card">
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/login">
      <div class="form-group">
        <label for="l-username">Username</label>
        <input type="text" id="l-username" name="username" required autofocus autocomplete="username">
      </div>
      <div class="form-group">
        <label for="l-password">Password</label>
        <input type="password" id="l-password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn">Masuk</button>
    </form>
  </div>
</div>
</body>
</html>
