<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Pantau Server</title>
<style>
:root{--bg:#0c0e14;--card:#181b27;--border:#23273a;--text:#e2e4ea;--dim:#6b7094;--blue:#3b82f6;--red:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;min-height:100vh}
.login-box{width:380px}
.login-header{text-align:center;margin-bottom:32px}
.login-header .logo{font-size:32px;margin-bottom:8px}
.login-header h1{font-size:20px;font-weight:600}
.login-header p{color:var(--dim);font-size:13px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:28px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-group input{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:14px;outline:none}
.form-group input:focus{border-color:var(--blue)}
.btn{width:100%;padding:10px;background:var(--blue);color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer;margin-top:8px}
.btn:hover{opacity:.85}
.error{background:rgba(239,68,68,.12);color:var(--red);padding:10px;border-radius:6px;font-size:13px;margin-bottom:16px}
</style>
</head>
<body>
<div class="login-box">
  <div class="login-header">
    <div class="logo">&#9673;</div>
    <h1>Pantau Server</h1>
    <p>Masuk ke panel monitoring</p>
  </div>
  <div class="card">
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/login">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn">Masuk</button>
    </form>
  </div>
</div>
</body>
</html>
