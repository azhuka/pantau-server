<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Pantau Server</title>
<style>
:root{
  --bg:#090d16;
  --bg-gradient:radial-gradient(ellipse at 50% 20%, rgba(30, 41, 59, 0.45) 0%, rgba(9, 13, 22, 1) 80%);
  --card:#131a29;
  --border:rgba(255,255,255,0.08);
  --border-focus:rgba(56,189,248,0.5);
  --text:#f1f5f9;
  --dim:#8492a6;
  --blue:#38bdf8;
  --blue-hover:#0ea5e9;
  --red:#f87171;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  background-image:var(--bg-gradient);
  background-attachment:fixed;
  color:var(--text);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.login-box{width:100%;max-width:390px;padding:20px}
.login-header{text-align:center;margin-bottom:28px}
.login-header .logo{margin-bottom:12px;display:inline-flex;color:var(--blue)}
.login-header h1{font-size:22px;font-weight:700;letter-spacing:-0.02em;color:#fff}
.login-header p{color:var(--dim);font-size:13px;margin-top:5px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:30px;box-shadow:0 12px 30px rgba(0,0,0,0.4)}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:11px;font-weight:600;color:var(--dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px}
.form-group input{width:100%;padding:10px 14px;background:rgba(9,13,22,0.7);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s}
.form-group input:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(56,189,248,0.2)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.btn{width:100%;padding:11px;background:var(--blue);color:#090d16;border:none;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;margin-top:10px;transition:all .15s ease}
.btn:hover{background:var(--blue-hover);color:#fff}
.btn:active{transform:scale(0.99)}
.error{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,0.3);color:var(--red);padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:18px}
</style>
</head>
<body>
<div class="login-box">
  <div class="login-header">
    <div class="logo">&#9673;</div>
    <h1>Pantau Server</h1>
    <p>Masuk ke panel monitoring</p>
  </div>
  <div class="card">
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/login">
      <div class="form-group">
        <label for="l-username">Username</label>
        <input type="text" id="l-username" name="username" required autofocus autocomplete="username">
      </div>
      <div class="form-group">
        <label for="l-password">Password</label>
        <input type="password" id="l-password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn">Masuk</button>
    </form>
  </div>
</div>
</body>
</html>
