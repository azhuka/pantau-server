# Konfigurasi Nginx untuk Pantau Server
# Simpan di: /etc/nginx/sites-available/pantau-server
# Aktifkan: ln -s /etc/nginx/sites-available/pantau-server /etc/nginx/sites-enabled/
# Uji konfigurasi: nginx -t && systemctl reload nginx

# 1. HTTP Redirect ke HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name pantau.example.com; # Ganti dengan domain atau IP server Anda

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pantau.example.com; # Ganti dengan domain server Anda

    # Sertifikat SSL (Gunakan Certbot: certbot --nginx -d pantau.example.com)
    ssl_certificate /etc/letsencrypt/live/pantau.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pantau.example.com/privkey.pem;

    # SSL Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Batas ukuran upload (Dibutuhkan untuk File Manager upload file besar)
    client_max_body_size 50M;

    # Logging
    access_log /var/log/nginx/pantau-access.log;
    error_log /var/log/nginx/pantau-error.log;

    # Proxy ke FastAPI / Uvicorn Backend
    location / {
        proxy_pass http://127.0.0.1:8400;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Dukungan WebSocket Khusus (Terminal Web PTY & Live Streaming)
    location /ws/ {
        proxy_pass http://127.0.0.1:8400;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Mencegah timeout koneksi terminal saat idle
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
